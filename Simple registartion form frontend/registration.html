<html>
  <head>
    <title>Registration form</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <h2>University registration form</h2>
    <form action="#" method="POST" enctype="multipart/form-data">
      <table>
        <tr>
          <td><label for="fname">FName:</label></td>
          <td>
            <input
              type="text"
              id="fname"
              name="fname "
              placeholder="Enter your first name"
              required
            />
          </td>
        </tr>

        <tr>
          <td><label for="lname">LName:</label></td>
          <td>
            <input
              type="text"
              id="lname"
              name="Fname "
              placeholder="Enter your last name"
            />
          </td>
        </tr>

        <tr>
          <td><label for="email">Email:</label></td>
          <td>
            <input
              type="text"
              id="email"
              name="Email"
              placeholder="Enter your email ID"
              required
            />
          </td>
        </tr>

        <tr>
          <td><label for="phone">Phone no:</label></td>
          <td>
            <input
              type="number"
              id="phone"
              name="Phone no:"
              placeholder="Enter your Phone number"
              min="1000000000"
              max="9999999999"
              required
            />
          </td>
        </tr>

        <tr>
          <td><label for="password">Password:</label></td>
          <td>
            <input
              type="password"
              id="password"
              name="Password"
              placeholder="Create a Password"
              required
              minlength="8"
            />
          </td>
        </tr>

        <tr>
          <td><label for="dob">Date of birth:</label></td>
          <td>
            <input
              type="date"
              id="dob"
              name="dob"
              placeholder="Enter your Date of birth"
            />
          </td>
        </tr>

        <tr>
          <td><label for="program">select program:</label></td>
          <td>
            <select id="program" name="program" required>
              <option value="">--Select program</option>
              <option value="BE CSE">BE computer science</option>
              <option value="BBA">BBA</option>
              <option value="BCA">BCA</option>
              <option value="B.sc nursing">Bsc Nursing</option>
              <option value="B.com">B.com</option>
            </select>
          </td>
        </tr>

        <tr>
          <td><label for="gender">Gender:</label></td>
          <td>
            <input type="radio" id="gender" name="gender" value="male" /><label
              for="Male"
              >Male</label
            >
            <input
              type="radio"
              id="gender"
              name="gender"
              value="Female"
            /><label for="Female">Female</label>
          </td>
        </tr>

        <tr>
          <td><label for="address">Address:</label></td>
          <td>
            <textarea
              id="address"
              name="address"
              rows="4"
              required
              placeholder="Enter your Address"
            ></textarea>
          </td>
        </tr>

        <tr>
          <td><label for="photo">Upload photo:</label></td>
          <td>
            <input
              type="file"
              id="photo"
              name="photo"
              accept="image/*"
              required
            />
          </td>
        </tr>

        <tr>
          <td>Terms & Conditions:</td>
          <td>
            <input type="checkbox" id="terms" name="terms" required />
            <label for="terms"
              >I hereby agree to the Terms and Conditions</label
            >
          </td>
        </tr>

        <tr>
          <td colspan="2" style="text-align: center">
            <button type="submit" class="btn">Register</button>
            <button type="reset" class="btn2">Reset</button>
          </td>
        </tr>
      </table>
    </form>
  </body>
</html>
