<!doctype html>
<html>
  <head>
    <title>Simple Calculator</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="calculator">
      <h1>Simple Calculator</h1>
      <form id="calculator-form">
        <input type="number" id="num1" placeholder="Enter your First Number" />
        <input type="number" id="num2" placeholder="Enter your Second Number" />
        <select id="operation">
          <option value="sum">Sum</option>
          <option value="product">Product</option>
          <option value="difference">Difference</option>
          <option value="remainder">Remainder</option>
          <option value="quotient">Quotient</option>
          <option value="power">Power</option>
          <option value="square-root">Square Root</option>
          <option value="square">Square</option>
        </select>
        <button type="button" onclick="calculate()">calculate</button>
      </form>
      <div id="result">
        <h2>Result:</h2>
        <p id="output">please enter numbers and select operation</p>
      </div>
    </div>
    <script src="calculator.js"></script>
  </body>
</html>
